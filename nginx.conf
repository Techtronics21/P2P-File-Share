worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Max upload size (500MB to match Java's limit)
    client_max_body_size 500M;

    # Upstream: Java HTTP API (runs on internal port 8080)
    upstream java_api {
        server 127.0.0.1:8080;
    }

    # Upstream: Java WebSocket Relay (runs on internal port 8081)
    upstream java_ws {
        server 127.0.0.1:8081;
    }

    server {
        # Railway/Render inject $PORT; fallback to 3000 for local dev
        listen __PORT__;

        # ── API routes → Java HTTP server ──
        location /api/ {
            # Strip the /api prefix before forwarding to Java
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://java_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Needed for large file uploads
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSocket relay → Java WebSocket server ──
        location /ws/ {
            proxy_pass http://java_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout (keep alive for long transfers)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Everything else → Next.js static files ──
        location / {
            root /app/ui-static;
            index index.html;
            try_files $uri $uri.html $uri/index.html /index.html;
        }

        # ── Next.js static assets ──
        location /_next/ {
            root /app/ui-static;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
