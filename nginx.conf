worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Max upload size (500MB)
    client_max_body_size 500M;

    # Upstream: Java HTTP API (internal port 8090)
    upstream java_api {
        server 127.0.0.1:8090;
    }

    # Upstream: Java WebSocket Relay (internal port 8091)
    upstream java_ws {
        server 127.0.0.1:8091;
    }

    server {
        # Listen on port 8080 — this is what Railway exposes
        listen 8080;

        # ── API routes → Java HTTP server ──
        location /api/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://java_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSocket relay → Java WebSocket server ──
        location /ws/ {
            proxy_pass http://java_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Health check shortcut (no /api prefix needed) ──
        location = /health {
            proxy_pass http://java_api/health;
            proxy_set_header Host $host;
        }

        # ── Static files ──
        location / {
            root /app/ui-static;
            index index.html;
            try_files $uri $uri.html $uri/index.html /index.html;
        }

        location /_next/ {
            root /app/ui-static;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
